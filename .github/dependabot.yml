version: 2
updates:
  # Keeps uv.lock moving under the same 7-day cooldown as `exclude-newer` in
  # pyproject.toml; `exclude` mirrors `exclude-newer-package` there. Security
  # updates skip the cooldown. These PRs touch no src/transect, so the
  # version-bump gate does not apply.
  - package-ecosystem: uv
    versioning-strategy: lockfile-only
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      exclude:
        - "inspect-ai"
        - "inspect-scout"
        - "inspect-viz"
        - "anthropic"
        - "openai"
        - "certifi"
    groups:
      python-packages:
        patterns:
          - "*"
    commit-message:
      prefix: chore

  # Actions are pinned to commit SHAs with a `# vX.Y.Z` comment; Dependabot
  # bumps both. The cooldown gives a compromised release time to be caught
  # before it is proposed; security updates skip it.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # One PR per week for every action update, majors included.
    groups:
      github-actions:
        patterns:
          - "*"
    # Conventional Commits title; `ci` keeps these out of the release notes.
    commit-message:
      prefix: ci
