name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Supply-chain cooldown, mirroring `exclude-newer` in pyproject.toml: every
  # uv resolution in CI, including the isolated wheel smoke test below, only
  # sees distributions uploaded at least 7 days ago.
  UV_EXCLUDE_NEWER: "7 days"
  # uv itself is a dependency; keep it at a release that is at least 7 days
  # old (the one uv.lock was produced with) rather than setup-uv's default of
  # the latest release. Bump by hand.
  UV_VERSION: "0.11.14"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Sync dependencies (exactly the committed lockfile)
        run: uv sync --locked
      - name: Lint + typecheck + tests
        run: make check
      - name: Install chromium for the browser test
        run: uv run --group ui-test playwright install chromium --with-deps
      - name: Browser test (must run, not skip)
        shell: bash
        run: |
          uv run --group ui-test pytest tests/test_report_integration.py \
            -v | tee pytest-ui.out
          if grep -q "SKIPPED" pytest-ui.out; then
            echo "::error::a report-integration test skipped in CI; they must all actually \
          run (chromium + network required)"
            exit 1
          fi

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
      - name: Build wheel + sdist
        run: uv build
      - name: Smoke-import the built wheel in a clean environment
        run: |
          uv run --isolated --no-project --with dist/*.whl \
            python -c "import transect, transect.report.render, transect.frames; print(transect.__version__)"
      - name: Skills ship in the wheel and install from it
        run: |
          cd "$(mktemp -d)"
          uv run --isolated --no-project \
            --with "$GITHUB_WORKSPACE"/dist/*.whl \
            python -m transect.skills install
          test -f .claude/skills/using-transect/SKILL.md
          test -f .claude/skills/transect-diagnostics/references/procedures.md

  version-bump:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASE_REF: ${{ github.base_ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Require a version bump when src/transect changes
        run: |
          git fetch origin "$BASE_REF"
          if git diff --quiet "origin/$BASE_REF"...HEAD -- src/transect; then
            echo "no source change; version bump not required"
            exit 0
          fi
          base_version=$(git show "origin/$BASE_REF:pyproject.toml" \
            | sed -n 's/^version = "\(.*\)"/\1/p')
          head_version=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)
          echo "base=$base_version head=$head_version"
          if [ "$base_version" = "$head_version" ]; then
            echo "::error::src/transect changed but pyproject.toml version did \
          not; bump it in this PR (see CONTRIBUTING.md)"
            exit 1
          fi
