[project]
name = "transect"
version = "0.4.0"
description = "Transect: transcript analysis for agent evals, built on inspect-scout"
license-files = ["LICENSE", "LICENSES/*.txt"]
requires-python = ">=3.12"
dependencies = [
    "inspect-ai>=0.3.277",
    "inspect-scout>=0.6.0",
    "pandas>=3.0.5",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
    "inspect-viz>=0.4.1",
    "markdown-it-py>=4.2.0",
    "jinja2>=3.1.6",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pandas-stubs>=3.0.5.260730",
    "ruff>=0.16.7",
    "mypy>=2.3.1",
    "pyright>=1.1.414",
    "pre-commit>=4.6.2",
    "types-pyyaml>=6.0.12.20260906",
    "anthropic>=1.5.0",
    "openai>=3.13.0",
]
ui-test = ["playwright>=1.62.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/transect"]

# ship the Claude Code skills inside the wheel; `python -m transect.skills
# install` copies them into a project's .claude/skills/
[tool.hatch.build.targets.wheel.force-include]
".claude/skills" = "transect/_skills"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
default-groups = ["dev"]
# 0.11.8 is the first uv that keeps uv.lock stable with a relative exclude-newer.
required-version = ">=0.11.8"
# Supply-chain cooldown: resolve only distributions uploaded at least 7 days
# ago, so a compromised release has time to be caught and yanked before it
# can land in uv.lock (see CONTRIBUTING.md). uv records the span in the
# lockfile; `uv lock --upgrade` honours it. CI exports the same value as
# UV_EXCLUDE_NEWER so uv runs outside the project obey it too.
exclude-newer = "7 days"

# Exempt from the cooldown, so a new release can be adopted the day it ships:
# the Inspect packages this is built on (first-party, released together, and
# transect often needs a Scout fix the week it ships) and the CA bundle
# (certifi), whose releases usually remove compromised roots. Nothing else:
# a provider SDK is exactly the shape of package that gets compromised.
# Mirror any change in `cooldown.exclude` in .github/dependabot.yml.
[tool.uv.exclude-newer-package]
inspect-ai = false
inspect-scout = false
inspect-viz = false
certifi = false

[tool.ruff]
target-version = "py312"
# pre-commit passes explicit filenames — keep the vendored exclusion
force-exclude = true
# vendored upstream source: never lint/format (keeps re-vendor diffs clean)
extend-exclude = [
    "src/transect/ingestion/openclaw_telemetry_hal", # vendored upstream
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
# RUF001: report strings deliberately use typographic chars (×, ·)
ignore = ["RUF001"]

[tool.ruff.lint.isort]
# keep `X as X` re-export blocks (report/reliability.py) as one import
combine-as-imports = true

[tool.mypy]
files = ["src/transect"]
exclude = ["src/transect/ingestion/openclaw_telemetry_hal"]
mypy_path = ["tests"] # resolves tests' flat imports

[tool.pyright]
include = ["src/transect"]
extraPaths = ["tests"]
exclude = [
    "src/transect/ingestion/openclaw_telemetry_hal",
    "**/node_modules",
    "**/__pycache__",
    "**/.*",
    ".venv",
]
